name: Python Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run_backend_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up example .env
      run: |
        cat <<EOF > .env
        DB_PASSWORD="PASSWORD"
        DB_USER="USER"
        DB_NAME="NAME"
        JWT_ALGORITHM="HS256"
        JWT_SECRET="CHANGEME"
        EOF

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3
    
    - name: Build and start images
      run: docker compose up -d --build backend database
    
    - name: Wait for backend
      working-directory: ./backend
      run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          docker compose logs
          exit 1
    
    - name: Run Tests
      run: docker compose exec -T backend pytest tests

    - name: Finish
      run: docker compose down -v

  lint_backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: "./backend/pyproject.toml"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    
    - name: Install the project
      working-directory: ./backend
      run: |
        uv tool install flake8
        uv tool install mypy
        uv sync --locked --all-extras --dev
      
    - name: Lint with flake8
      working-directory: ./backend
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Typecheck with mypy
      working-directory: ./backend
      run: uv run mypy --check-untyped-defs app
