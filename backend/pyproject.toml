[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "email-validator>=2.3.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "flask-jwt-extended[asymmetric-crypto]>=4.7.1",
    "flask-socketio>=5.6.0",
    "flask-sqlalchemy>=3.1.1",
    "geopy>=2.4.1",
    "phonenumbers>=9.0.20",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "pydantic-extra-types>=2.10.6",
    "pyjwt>=2.10.1",
    "sqlacodegen>=3.2.0",
    "sqlalchemy>=2.0.44",
    "sqlmodel>=0.0.27",
    "types-flask-cors>=6.0.0.20250809",
    "types-flask-socketio>=5.6.0.20251228",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
]

[tool.mypy]
disable_error_code = ["import-untyped"]